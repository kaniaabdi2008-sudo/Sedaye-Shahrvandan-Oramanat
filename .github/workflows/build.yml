name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Nitron
        run: npm install -g nitron

      - name: Initialize Nitron
        run: npx nitron init --preset vanilla --force

      - name: Build APK
        run: npx nitron build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SedayeShahrvand-Oramanat-APK
          path: dist/*.apk
